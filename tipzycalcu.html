<!DOCTYPE html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tipzy Calculator</title>
<link rel="icon" type="image/x-icon" href="Tipzy-Sales-Calculator/tipzylogo.png">


<style>
    body {
        background-image: url(https://media.gettyimages.com/id/1400867925/video/defocused-of-nightclub-or-restaurant-at-night.jpg?s=640x640&k=20&c=UlfP_p6Mlnn_rljK48OQhLggkkbzrXoYqrL7CvuKTUE=);
        background-repeat: no-repeat;
        background-size: cover;
        background-position: center;

        font-family: "verdana";
        display: flex;
        justify-content: center;
        align-items: center;
        height: 120vh;
    }

    .logo {
        display: block;
        margin: 0 auto 10px auto;
        border-radius: 50%;
    }

    /* ----- TABS --------*/
    .ulo {
        display: flex;
        gap: 8px;
        z-index: 2;
    }

    .tab {
        background: white;
        padding: 30px;
        width: 340px;
        border-radius: 20px;
        box-shadow: 0px 10px 5px black;
        margin-bottom: -10PX;
        display: flex;
        flex-direction: column;
        display: none;
    }

    .tab.active {
        display: block;
        background: white;
        padding: 20px;
        border-radius: 0 0 20px 20px;
    }

    .tab-btn {
        flex: 1;
        padding: 10px;
        border: none;
        cursor: pointer;
        font-weight: bold;
        background: #710014;
        color: whitesmoke;
        border-radius: 12px 12px 0 0;
    }

    .tab-btn.active {
        background: white;
        color: #710014;
        border-bottom: 2px solid white;
    }

    h2 {
        margin-top: 0;
        text-align: center;
        font-size: 1.4rem;
        color: #333;
    }
    input {
        width: 90%;
        padding: 10px;
        margin-bottom: 16px;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 10px;
        outline: none;
    }

    button {
        width: 100%;
        padding: 12px;
        background: #0f52ba;
        color: white;
        border: none;
        border-radius: 12px;
        font-size: 1rem;
        cursor: pointer;
    }

    button:active {
        transform: scale(0.98);
    }

    .clear {
        background: #e0e0e0;
        color: #333;
        margin-top: 10px;
    }

    .result {
        margin-top: 20px;
        font-size: 1.2rem;
        font-weight: bold;
        text-align: center;
        color: #480001;
    }

    table {
        border-collapse: collapse;
        font-family: ;
    }

    td, th {
        border: 1px ;
        padding: 10px;
    }

    th {
        text-align: center;
    }
    tr {
      border-bottom: 1px solid #ddd;
    }
    .logo {
        border-radius: 50%;
        align-self: center;

    }

    /*  -----PAYMENT METHOD---------  */
    .switch {
      position: relative;
      display: inline-block;
      width: 200px;
      height: 36px;
    }

    .switch input { 
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0;
      left: 0;
      right: 0;
      bottom: 0;
      background-color: #06400c;
      -webkit-transition: .4s;
      transition: .4s;
      font-family: "arial";
      font-weight: bold;
    }

    .slider:before {
      position: absolute;
      content: "CASH";
      align-content: center;
      height: 26px;
      width: 60px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      -webkit-transition: .4s;
      transition: .4s;
    }

    input:checked + .slider {
      background-color: #2196F3;
    }

    input:focus + .slider {
      box-shadow: 0 0 1px #2196F3;
    }

    input:checked + .slider:before {
      -webkit-transform: translateX(130px);
      -ms-transform: translateX(130px);
      transform: translateX(130px);
      content: "GCASH";
    }

    .back {
      position: absolute;
      top: 15px;
      left: 15px;
      color: white;
      text-decoration: none;
      font-weight: bold;
    }
</style>


<body>
    <a href="index.html" class="back">← Back</a>
    
    <div class="main">
        <div class="ulo">
          <button class="tab-btn active" data-tab="calc" onclick="showTab('calc')">Mix & Match</button>
          <button class="tab-btn" data-tab="sets" onclick="showTab('sets')">Sets</button>
        </div>
      <div class="tab active" id="calc">
            <img class= "logo" src="tipzylogo.png" width = "70" height = "70">
          
        <h2>Price Calculator</h2>
        <table>
            <tr>
                <th>Style</th>
                <th>Price</th>
                <th>Quantity</th>
            </tr>
            <tr>
                <td>Basic</td>
                <td>&#8369;25</td>
                <td>
                    <input id="sim" type="number" placeholder="Enter quantity">
                </td>
            </tr>
            <tr>
                <td>Designed</td>
                <td>&#8369;35</td>
                <td>
                    <input id="des" type="number" placeholder="Enter quantity">
                </td>
            </tr>
            <tr>
                <td>Complex</td>
                <td>&#8369;50</td>
                <td>
                    <input id="com" type="number" placeholder="Enter quantity">
                </td>
            </tr>
        </table>
        
        <h4>Payment Method</h4>
        <label class="switch">
            <input type="checkbox" id="payment">
            <span class="slider"></span>
        </label>
        
        <div class="result" id="result">TOTAL:</div>
        <br>
        <button onclick="tot()">Calculate</button>
        <button class="clear" onclick="Clear()">New</button>
        
    </div>
    <div class="tab" id="sets">
        <img class= "logo" src="tipzylogo.png" width = "70" height = "70">

        <h2>Set Price</h2>
        <input id="manual" type="number" placeholder="Enter price">

        <h4>Payment Method</h4>
        <label class="switch">
            <input type="checkbox" id="paymentSET">
            <span class="slider"></span>
        </label>
        <br><br>
        <div id="istatus" style="display: none; font-weight: bolder; color: #710014;"> SENT!
        </div>

        <br>

        <button onclick="sendSet()">Paldo</button>
        <button class="clear" onclick="bagoset()">New</button>
    </div>
    </div>

</body>

<script>
  window.onload = () => showTab('calc');

    function showTab(tabId) {
      document.querySelectorAll('.tab').forEach(tab => {
          tab.classList.remove('active');
      });

      document.getElementById(tabId).classList.add('active');

      document.querySelectorAll('.tab-btn').forEach(btn => {
          btn.classList.remove('active');
      });

      document.querySelector(`[data-tab="${tabId}"]`).classList.add('active');
     }

     /* SENDS THE SET */

    function sendSet() {
        const el = document.getElementById("istatus");
        el.style.display = "block"

        const price = Number(document.getElementById("manual").value);
        if (!price || price <= 0) return alert("Enter a valid price");

        const pay = document.getElementById("paymentSET").checked ? "GCASH" : "CASH";

        sendtoGS(0, 0, 0, price, pay, "SET");
    }

    /* ICLEAR ANG SET */

    function bagoset() {
        document.getElementById("manual").value = "";
        document.getElementById("paymentSET").checked = false;

        const yawa = document.getElementById("istatus");
        yawa.style.display = "none";
        
    }

    function tot() {
        const sim = document.getElementById('sim').value;
        const des = document.getElementById('des').value;
        const com = document.getElementById('com').value;
        
        const total = sim*20 + des*35 + com*50;

        document.getElementById("result").textContent = "TOTAL: "+ total;

        /*GCASH OR CASH*/
        const bayad = document.getElementById('payment');
        const way = bayad.checked ? "GCASH" : "CASH";


        sendtoGS(sim, des, com, total, way);
    }

    function Clear() {
        document.getElementById("sim").value = "";
        document.getElementById("des").value = "";
        document.getElementById("com").value = "";
        document.getElementById("result").textContent = "TOTAL: ";
    }

 
    function sendtoGS(sim, des, com, total, way, entryType) {
        const url = "https://script.google.com/macros/s/AKfycbzsEUSDStac6fPN1DjDemDOsKBf1RiC_HusCqntZalk0hBlmp-NTZCBqe9BF7K0isGbKw/exec";

        const SECRET_KEY = "TIPZY_SECRET_2987";

        fetch(url, {
            method: "POST",
            body: JSON.stringify({
                key: SECRET_KEY,
                simple: sim,
                designed: des,
                complex: com,
                revenue: total,
                MOP: way,
                entryType: entryType
            })
        })
        .then(response => response.json())
        .then(data => console.log("Saved:", data))
        .catch(err => console.error(err));
    }

</script>
